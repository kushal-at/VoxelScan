name: Build APK & Publish to GitHub Releases v1.2

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v1.2*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-v1-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-licenses: 'y'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env File Exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compile & Assemble VoxelScan 3D v1.2 APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package Version 1.2 Release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxelScan-3D-v1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk "VoxelScan-3D-v1.2.${{ github.run_number }}.apk"

      - name: Upload VoxelScan 3D v1.2 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelScan-3D-v1.2-APK
          path: |
            VoxelScan-3D-v1.2.apk
            VoxelScan-3D-v1.2.${{ github.run_number }}.apk

      - name: Publish to GitHub Releases (Version 1.2)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "VoxelScan 3D v1.2 (Build #${{ github.run_number }})"
          body: |
            ## VoxelScan 3D — Version 1.2 Release

            - **Icon-First Material Extended UI**: Streamlined icon-first controls across Scanner, 3D Studio, Batch Pipeline, and Settings.
            - **Redesigned App Logo & Launch Screen**: Isometric voxel-to-quad emblem, adaptive launcher icon, and animated 3D studio launch screen.
            - **Photogrammetry & Export Engine**: CameraX capture and analysis, IMU pose tracking, and FBX, OBJ, and STL export support.

            ### Installation
            Download and install `VoxelScan-3D-v1.2.apk` on your Android device.
          files: |
            VoxelScan-3D-v1.2.apk
            VoxelScan-3D-v1.2.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
