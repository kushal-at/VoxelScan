name: Build APK & Publish to GitHub Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxelScan-3D-v1.0.${{ github.run_number }}.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelScan-3D-APK
          path: VoxelScan-3D-v1.0.${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VoxelScan 3D v1.0.${{ github.run_number }}"
          body: |
            Automated APK build of **VoxelScan 3D** (Realtime 3D Video-to-Mesh Scanner, Retopology & Batch Asset Pipeline).
            Download and install `VoxelScan-3D-v1.0.${{ github.run_number }}.apk` on your Android device.
          files: VoxelScan-3D-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
